name: release-check

on:
  push:
    branches: [dsh-qqbot-plus, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: BOM 检查
        run: node scripts/check-bom.mjs
      - name: 脱敏检查
        run: node scripts/check-sanitize.mjs
      - name: 清单与语法
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
          for f in $(find lib scripts -name '*.js' -o -name '*.mjs' | sort); do node --check "$f" || exit 1; done
          echo "syntax OK"